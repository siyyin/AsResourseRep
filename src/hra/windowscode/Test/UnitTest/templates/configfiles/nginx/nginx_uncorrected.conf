
#worker_processes 1;
worker_processes;

events{
    worker_connections  1024; # ruanyuan
}

http {
    include       mime.types;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       10.21.139.236:81;
        server_name  localhost;
        location / {
            root   html;
            index  index.html index.htm;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    include testnx_uncorrected*.conf;
    include virtual_testnx_uncorrected*.conf;
    #include testnx*.conf;
    include nginxtest_uncorrected.conf;
    include virtual_nginxtest_uncorrected.conf;
    #include nginxtest.conf;
}
