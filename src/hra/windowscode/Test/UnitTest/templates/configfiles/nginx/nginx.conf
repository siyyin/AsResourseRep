
worker_processes  1;

events {
    worker_connections  1024; # ruanyuan
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    ssl off;
    root /home/ruanyuan/HRA;

    server {
        listen       10.21.139.236:81;
        server_name  localhost;
        location / {
            root   html;
            index  index.html index.htm;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    server {
        listen       [2001:db8::a00:20ff:fea7:ccea]:88 ssl;
        server_name  localhost:88;
        location / {
            root   "/usr/local/software/nginx-1.20.2/html/discuzx34";
            index  index.html index.htm index.php;
        }
        location ~ \.php$ {
            root   "/usr/local/software/nginx-1.20.2/html/discuzx34";
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    server {
        listen       89 ssl;
        server_name  localhost:89;
        location / {
            root   "html/wordpress50";
            index  index.html index.htm index.php;
        }
        location ~ \.php$ {
            root   "/usr/local/software/nginx-1.20.2/html/wordpress50";
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    include ./testnx*.conf;
    include ./nginxtest.conf;
}
