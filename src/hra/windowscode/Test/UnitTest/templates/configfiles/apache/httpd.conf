# Apache Hause .conf file for TLS/1.3 supported versions
#

Define SRVROOT01 "/var"
Define SRVROOT02 "${SRVROOT01}/www"
Define SRVROOT03 "${SRVROOT02}/html"

Define HTTP_PORT01 "8998"
Define HTTP_PORT02 "9898"
Define HTTP_PORT03 "8180"


ServerRoot "/etc/httpd"

#Listen 12.34.56.78:80
Listen 80
Listen ${HTTP_PORT03}
Listen 8098
Listen 192.168.100.191:9020
Listen 192.168.152.191:9030 https
Listen [2001:db8::a00:20ff:fea7:ccea]:9040
Listen [2001:db8::a00:20ff:fea7:ccea]:9050 https
Listen 9055 https

User apache
Group apache
ServerAdmin root@localhost

ServerName www.example.com:80

<Directory />
    AllowOverride none
    Require all denied 
</Directory>

#DocumentRoot "/var/www/html"
DocumentRoot "${SRVROOT03}/tmp"

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

#
ErrorLog "logs/error_log"

AddDefaultCharset UTF-8
EnableSendfile on

Alias /testPath01  /home/ruanyuan/HRA/test
Alias "/corePath01"  "/home/ruanyuan/HRA/core"
Alias /build01 


IncludeOptional apache_sub/*.conf
Include ssl.conf

